<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root { --fg:#1f2328; --muted:#5b636d; --line:#d8dce1; --bg:#fff; --soft:#f6f7f9;
  --red:#b3261e; --yellow:#a86a00; --green:#1f7a3d; --info:#2b5fa8; --na:#6b7280; --fail:#4a2f6b; }
* { box-sizing: border-box; }
body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg);
  max-width: 56rem; margin: 2rem auto; padding: 0 1.25rem; }
h1 { font-size: 1.6rem; margin: 0 0 .25rem; } h2 { font-size: 1.25rem; margin: 2.2rem 0 .6rem; border-bottom: 1px solid var(--line); padding-bottom: .25rem; }
h3 { font-size: 1.05rem; margin: 0; } h4 { font-size: .95rem; margin: 1rem 0 .4rem; }
p { margin: .4rem 0; } a { color: var(--info); }
.muted { color: var(--muted); font-size: .9rem; } .small { font-size: .85rem; }
.banner { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: .6rem .9rem; margin: 1rem 0; font-size: .92rem; }
.light { display: inline-block; padding: .05rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 600; color: #fff; white-space: nowrap; vertical-align: middle; }
.light.red { background: var(--red); } .light.yellow { background: var(--yellow); } .light.green { background: var(--green); }
.light.info { background: var(--info); } .light.na { background: var(--na); } .light.fail { background: var(--fail); }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 0 .4rem; font-size: .78rem; color: var(--muted); margin-right: .25rem; }
ol.priority { padding-left: 1.3rem; } ol.priority li { margin: .55rem 0; }
.limits { border-left: 4px solid var(--fail); background: var(--soft); padding: .6rem 1rem; border-radius: 0 6px 6px 0; }
.limits ul { margin: .3rem 0; padding-left: 1.2rem; }
.module { border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; margin: 1rem 0; }
.module.failed { border-color: var(--fail); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: .7rem 0; }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
.col { background: var(--soft); border-radius: 6px; padding: .6rem .8rem; font-size: .92rem; }
.col .label { text-transform: uppercase; letter-spacing: .04em; font-size: .72rem; color: var(--muted); display: block; margin-bottom: .2rem; }
.finding { border-top: 1px solid var(--line); padding: .7rem 0; }
.finding .id { font-family: ui-monospace, monospace; font-size: .75rem; color: var(--muted); }
blockquote { margin: .4rem 0; padding: .3rem .8rem; border-left: 3px solid var(--line); color: #333; font-size: .92rem; }
blockquote cite { display: block; font-style: normal; color: var(--muted); font-size: .8rem; }
details { margin: .5rem 0; } summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
details > *:not(summary) { margin-left: .4rem; }
.tablewrap { overflow-x: auto; } table { border-collapse: collapse; font-size: .82rem; width: 100%; }
th, td { border: 1px solid var(--line); padding: .3rem .45rem; text-align: left; vertical-align: top; } th { background: var(--soft); }
footer { margin-top: 3rem; border-top: 1px solid var(--line); padding-top: 1rem; font-size: .82rem; color: var(--muted); }
footer dl { display: grid; grid-template-columns: max-content 1fr; gap: .15rem 1rem; } footer dt { font-weight: 600; } footer dd { margin: 0; word-break: break-all; }
</style>
</head>
<body>
{{body}}
</body>
</html>
